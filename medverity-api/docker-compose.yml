version: "3.9"

services:
  # FastAPI Backend
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped
    volumes:
      - ./app/db:/app/app/db   # Persist JSON files

  # Celery Worker (background tasks)
  celery_worker:
    build: .
    command: celery -A celery_worker worker --loglevel=info --concurrency=2
    env_file:
      - .env
    depends_on:
      - redis
      - api
    restart: unless-stopped

  # Celery Beat (scheduler)
  celery_beat:
    build: .
    command: celery -A celery_worker beat --loglevel=info
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped

  # Redis (message broker for Celery)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  redis_data:
